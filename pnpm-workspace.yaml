packages:
  - frontend

# postinstall scripts are blocked by default (supply chain). msw needs them only to generate
# a service worker for the browser — we use it in Node (vitest).
allowBuilds:
  msw: false

# pnpm holds back very fresh package versions (minimumReleaseAge). The entries below are a
# deliberate allowance for a specific version — review them like any other dependency change.
minimumReleaseAgeExclude:
  - '@hookform/resolvers@5.6.0'
  - react-hook-form@7.84.0

# Transitive version overrides. Every entry exists because of a concrete advisory caught by
# `pnpm audit` in CI — not "just in case".
overrides:
  # GHSA-2v37-7h3g-55p8 and related: quadratic CPU consumption on merge keys and `!!omap`.
  # Arrives through @hey-api/openapi-ts (the client generator), which has not released a fix.
  js-yaml: ^4.3.1
  # GHSA: a generator with size <= 0 spins forever. Arrives through postcss inside vite.
  nanoid: ^3.3.18
